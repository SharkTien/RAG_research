<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NTC Document RAG</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:980px;margin:40px auto;padding:0 20px;color:#172033;background:#f6f8fb}
    .card{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:24px;margin:18px 0;box-shadow:0 4px 16px #1720330d}
    h1{margin-top:0}.drop{border:2px dashed #94a3b8;border-radius:12px;padding:32px;text-align:center}.drop:hover{border-color:#2563eb}
    button{background:#2563eb;color:white;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}button:disabled{opacity:.5}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #e2e8f0;font-size:14px}small,.muted{color:#64748b}.status{font-weight:600;color:#0f766e}
  </style>
</head>
<body>
  <h1>NTC Document RAG</h1><p class="muted">Data ingestion · bản gốc được lưu trong MinIO, metadata trong PostgreSQL</p>
  <section class="card">
    <h2>Upload tài liệu</h2>
    <form id="upload-form"><div class="drop"><input id="files" name="files" type="file" multiple accept=".pdf,.docx,.pptx,.txt,.md,.jpeg,.jpg,.png"><p><small>PDF, DOCX, PPTX, TXT, Markdown, JPEG, PNG · tối đa 50 MB/file</small></p></div><br><button id="submit" type="submit">Upload</button></form>
    <p id="message" class="muted"></p>
  </section>
  <section class="card"><h2>Đã ingestion</h2><table><thead><tr><th>Tên file</th><th>Kích thước</th><th>SHA-256</th><th>Trạng thái</th></tr></thead><tbody id="rows"></tbody></table></section>
  <script>
    const files=document.querySelector('#files'), msg=document.querySelector('#message'), rows=document.querySelector('#rows');
    const size=n=>`${(n/1024/1024).toFixed(2)} MB`;
    async function refresh(){const r=await fetch('/api/documents');const d=await r.json();rows.innerHTML=(d.documents||[]).map(x=>`<tr><td>${x.filename}</td><td>${size(x.size_bytes)}</td><td><small>${x.sha256.slice(0,16)}…</small></td><td class="status">${x.status}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Chưa có tài liệu</td></tr>'}
    document.querySelector('#upload-form').onsubmit=async e=>{e.preventDefault();if(!files.files.length){msg.textContent='Hãy chọn ít nhất một file.';return}const b=new FormData();[...files.files].forEach(f=>b.append('files',f));document.querySelector('#submit').disabled=true;msg.textContent='Đang upload…';const r=await fetch('/api/documents',{method:'POST',body:b});const d=await r.json();msg.textContent=r.ok?`Đã upload ${d.uploaded.length} file.`:(d.detail||'Upload thất bại');files.value='';document.querySelector('#submit').disabled=false;refresh()};refresh();
  </script>
</body>
</html>
